{% extends 'base.html' %}

{% block head %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
    .scanner-container {
        max-width: 440px;
        margin: 2rem auto;
    }

    #reader {
        width: 100% !important;
        border: none !important;
        border-radius: var(--radius-lg);
        overflow: hidden;
    }

    #reader__scan_region {
        background: black !important;
    }

    #reader__dashboard {
        padding: 1rem !important;
        background: var(--bg-main) !important;
    }

    .scan-frame {
        position: relative;
        background: black;
        border-radius: var(--radius-xl);
        overflow: hidden;
        aspect-ratio: 1;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .corner-guide {
        position: absolute;
        width: 3rem;
        height: 3rem;
        border-color: var(--primary);
        border-style: solid;
        z-index: 10;
        pointer-events: none;
    }

    .tl { top: 1.5rem; left: 1.5rem; border-width: 6px 0 0 6px; border-top-left-radius: 1rem; }
    .tr { top: 1.5rem; right: 1.5rem; border-width: 6px 6px 0 0; border-top-right-radius: 1rem; }
    .bl { bottom: 1.5rem; left: 1.5rem; border-width: 0 0 6px 6px; border-bottom-left-radius: 1rem; }
    .br { bottom: 1.5rem; right: 1.5rem; border-width: 0 6px 6px 0; border-bottom-right-radius: 1rem; }

    .scan-line {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
        animation: scanMove 3s infinite ease-in-out;
        z-index: 5;
    }

    @keyframes scanMove {
        0%, 100% { top: 20%; opacity: 0.2; }
        50% { top: 80%; opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<div class="scanner-container animate-slide-up">
    <div class="text-center mb-8">
        <p class="badge badge-primary mb-2">{{ t('Verification') }}</p>
        <h1>{{ t('Scan QR Code') }}</h1>
        <p>{{ t('Point camera at the customer\'s screen') }}</p>
    </div>

    <div class="scan-frame mb-8">
        <div id="reader"></div>
        <div class="corner-guide tl"></div>
        <div class="corner-guide tr"></div>
        <div class="corner-guide bl"></div>
        <div class="corner-guide br"></div>
        <div class="scan-line"></div>
    </div>

    <div class="card text-center mb-8">
        <p id="scan-status" class="text-sm font-semibold text-muted italic">
            {{ t('Waiting for QR code...') }}
        </p>
    </div>

    <div class="flex flex-col gap-3">
        <a href="{{ url_for('worker_dashboard') }}" class="btn btn-secondary w-full h-14">
            <i class="fa-solid fa-arrow-left mr-2"></i>
            {{ t('Back to Dashboard') }}
        </a>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
    const scanner = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    async function onScanSuccess(decodedText) {
        try {
            const payload = JSON.parse(decodedText);
            if (payload.bid && payload.tok) {
                await scanner.stop();
                document.getElementById('scan-status').textContent = "{{ t('Booking detected! Verifying...') }}";
                document.getElementById('scan-status').className = "text-sm font-bold text-primary";
                
                const res = await fetch(`/api/bookings/${payload.bid}/checkin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: payload.tok })
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('scan-status').className = "text-sm font-bold text-success";
                    document.getElementById('scan-status').textContent = "✓ " + (data.message || "{{ t('Success!') }}");
                    setTimeout(() => window.location.href = '/dashboard/worker', 2000);
                } else {
                    document.getElementById('scan-status').className = "text-sm font-bold text-coral";
                    document.getElementById('scan-status').textContent = "⚠ " + (data.error || 'Verification failed');
                    setTimeout(() => scanner.start({ facingMode: "environment" }, config, onScanSuccess), 3000);
                }
                return;
            }
        } catch (e) {}

        scanner.stop().then(() => {
            document.getElementById('scan-status').textContent = "{{ t('QR detected! Opening...') }}";
            if (decodedText.includes('/complete-job/')) {
                window.location.href = decodedText;
            } else {
                document.getElementById('scan-status').textContent = "{{ t('Wrong QR code. Try again.') }}";
                setTimeout(() => scanner.start({ facingMode: "environment" }, config, onScanSuccess), 2000);
            }
        });
    }

    scanner.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            document.getElementById('scan-status').textContent = "{{ t('Camera access denied. Please enable and reload.') }}";
            document.getElementById('scan-status').className = "text-sm font-bold text-coral";
        });
</script>
{% endblock %}
