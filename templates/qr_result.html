{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center py-20 animate-slide-up">
    <div class="card p-12 text-center max-w-sm w-full">
        {% if success %}
            <div class="w-20 h-20 bg-success/10 text-success rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-check text-4xl"></i>
            </div>
            <h1 class="text-2xl mb-2">{{ t('Success!') }}</h1>
        {% else %}
            <div class="w-20 h-20 bg-coral/10 text-coral rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-xmark text-4xl"></i>
            </div>
            <h1 class="text-2xl mb-2">{{ t('Error') }}</h1>
        {% endif %}
        
        <p class="text-muted text-sm mb-8">{{ message }}</p>
        
        <a href="{{ url_for('worker_dashboard') if session.role == 'worker' else url_for('user_dashboard') }}" class="btn btn-primary w-full h-14">
            {{ t('Go to Dashboard') }}
        </a>
    </div>
</div>
{% endblock %}
